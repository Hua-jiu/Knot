[package]
name = "knot-core"
version.workspace = true
edition.workspace = true
description = "SSH / SFTP core for Knot, independent of the UI layer"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
russh = "0.65"
russh-sftp = "3"
# Same version russh pins; enabled here only for the `rand_core` feature (key generation).
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["rand_core"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
ssh2-config = "0.9"
keyring = "4"
dirs = "6"
log = "0.4"
portable-pty = "0.9"

[dev-dependencies]
tempfile = "3"
